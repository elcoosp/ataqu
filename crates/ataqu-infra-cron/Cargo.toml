[package]
name = "ataqu-infra-cron"
version = "0.1.0"
edition = "2024"

[dependencies]

sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "chrono", "uuid", "json"] }
serde_json = "1.0"
uuid = { version = "1.24", features = ["v4"] }
tracing = "0.1"
tokio = { version = "1.52", features = ["rt", "time", "macros"] }