[package]
name = "ataqu-infra-shopify"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tokio = { version = "1.52", features = ["sync", "time"] }
uuid = { version = "1.24", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2.5"
