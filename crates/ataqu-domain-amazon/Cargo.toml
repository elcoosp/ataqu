[package]
name = "ataqu-domain-amazon"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
ataqu-kernel = { path = "../ataqu-kernel" }
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.24", features = ["v4"] }
