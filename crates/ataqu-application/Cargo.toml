[package]
name = "ataqu-application"
version = "0.1.0"
edition = "2024"

[dependencies]
uuid = { version = "1.24.0", features = ["v4", "v7", "serde"] }
thiserror = "2.0.18"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
chrono = { version = "0.4.45", features = ["serde"] }
anyhow = "1.0.103"
async-trait = "0.1"
sea-orm = { version = "2.0.0-rc.41", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "tls-rustls", "chrono", "uuid", "json"] }
tracing = "0.1"
metrics = "0.23"
tokio = { version = "1.52", features = ["sync", "rt", "time", "macros"] }
tokio-stream = { version = "0.1", features = ["sync"] }
ataqu-kernel = { path = "../ataqu-kernel" }
ataqu-domain-cinq = { version = "0.1.0", path = "../ataqu-domain-cinq" }
ataqu-domain-pivot = { version = "0.1.0", path = "../ataqu-domain-pivot" }
ataqu-infra-repositories = { path = "../ataqu-infra-repositories" }
ataqu-infra-pools = { path = "../ataqu-infra-pools" }
ataqu-infra-idempotency = { path = "../ataqu-infra-idempotency" }
ataqu-contracts = { path = "../ataqu-contracts" }
ataqu-security = { version = "0.1.0", path = "../ataqu-security", features = ["infra-pii-access"] }
ataqu-domain-aegis = { version = "0.1.0", path = "../ataqu-domain-aegis" }
ataqu-domain-pause = { version = "0.1.0", path = "../ataqu-domain-pause" }
ataqu-domain-dial = { version = "0.1.0", path = "../ataqu-domain-dial" }
ataqu-domain-sond = { version = "0.1.0", path = "../ataqu-domain-sond" }
ataqu-domain-spark = { version = "0.1.0", path = "../ataqu-domain-spark" }
ataqu-domain-tempo = { version = "0.1.0", path = "../ataqu-domain-tempo" }
ataqu-domain-vault = { version = "0.1.0", path = "../ataqu-domain-vault" }
ataqu-domain-vista = { version = "0.1.0", path = "../ataqu-domain-vista" }
ataqu-domain-gdpr = { version = "0.1.0", path = "../ataqu-domain-gdpr" }
ataqu-domain-onboarding = { path = "../ataqu-domain-onboarding" }
ataqu-domain-health = { path = "../ataqu-domain-health" }
ataqu-domain-changelog = { path = "../ataqu-domain-changelog" }
ataqu-domain-shopify = { path = "../ataqu-domain-shopify" }
ataqu-infra-outbox = { path = "../ataqu-infra-outbox" }
ataqu-infra-storage = { path = "../ataqu-infra-storage" }
csv = "1.3"
futures = "0.3"
reqwest = { version = "0.12", features = ["json"] }
rand = "0.8.5"
croner = "2.0"
rust_decimal = "1.0"
argon2 = "0.5.3"
jsonwebtoken = "9.3.0"
base64 = "0.22.1"
sha2 = "0.10"
chrono-tz = "0.10"
base32 = { version = "0.4", default-features = false }
