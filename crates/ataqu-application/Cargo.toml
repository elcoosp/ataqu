[package]
name = "ataqu-application"
version = "0.1.0"
edition = "2024"

[dependencies]
ataqu-kernel = { path = "../ataqu-kernel" }
ataqu-domain-vault = { path = "../ataqu-domain-vault" }
ataqu-infra-repositories = { path = "../ataqu-infra-repositories" }
sea-orm = { version = "2.0.0-rc.41", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
uuid = { version = "1.24.0", features = ["v7", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.18"
anyhow = "1.0.103"
async-trait = "0.1.91"
