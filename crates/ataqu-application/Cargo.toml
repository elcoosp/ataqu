[package]
name = "ataqu-application"
version = "0.1.0"
edition = "2024"

[dependencies]
ataqu-kernel = { path = "../ataqu-kernel" }
ataqu-contracts = { path = "../ataqu-contracts" }
ataqu-domain-tempo = { path = "../ataqu-domain-tempo" }
ataqu-infra-repositories = { path = "../ataqu-infra-repositories" }
sea-orm = { version = "2.0.0-rc.41", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
uuid = { version = "1.24.0", features = ["v4", "v5", "v7", "serde"] }
thiserror = "2.0.18"
tracing = "0.1.44"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

