[package]
name = "ataqu-application"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
async-trait = "0.1.91"
ataqu-contracts = { path = "../ataqu-contracts" }
ataqu-domain-aegis = { version = "0.1.0", path = "../ataqu-domain-aegis" }
ataqu-domain-dial = { path = "../ataqu-domain-dial" }
ataqu-domain-sond = { path = "../ataqu-domain-sond" }
ataqu-domain-spark = { path = "../ataqu-domain-spark" }
ataqu-domain-tempo = { path = "../ataqu-domain-tempo" }
ataqu-domain-vault = { path = "../ataqu-domain-vault" }
ataqu-infra-idempotency = { path = "../ataqu-infra-idempotency" }
ataqu-infra-pools = { version = "0.1.0", path = "../ataqu-infra-pools" }
ataqu-infra-repositories = { path = "../ataqu-infra-repositories" }
ataqu-kernel = { path = "../ataqu-kernel" }
ataqu-security = { version = "0.1.0", path = "../ataqu-security" }
chrono = { version = "0.4.45", features = ["serde"] }
metrics = "0.24.6"
mockall = { version = "0.15.0", default-features = false }
sea-orm = { version = "2.0.0-rc.41", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.18"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = { version = "0.1.44", features = ["attributes"] }
uuid = { version = "1.24.0", features = ["v4", "v5", "v7", "serde"] }
