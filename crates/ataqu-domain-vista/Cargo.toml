[package]
name = "ataqu-domain-vista"
version = "0.1.0"
edition = "2024"

[dependencies]
ataqu-kernel = { path = "../ataqu-kernel" }
uuid = { version = "1.24.0", features = ["v4", "v7"] }
thiserror = "2.0.18"
async-trait = "0.1.91"
serde = { version = "1.0", features = ["derive"] }
rust_decimal = "1.32"
serde_json = "1.0.151"
chrono = { version = "0.4", features = ["serde"] }
