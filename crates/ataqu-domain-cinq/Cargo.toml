[package]
name = "ataqu-domain-cinq"
version = "0.1.0"
edition = "2024"

[dependencies]
ataqu-kernel = { path = "../ataqu-kernel" }
ataqu-security = { path = "../ataqu-security" }
uuid = { version = "1.0", features = ["v7"] }
chrono = { version = "0.4" }
thiserror = "2.0"
async-trait = "0.1.91"
rust_decimal = "1.32"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
