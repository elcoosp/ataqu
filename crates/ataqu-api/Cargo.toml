[package]
name = "ataqu-api"
version = "0.1.0"
edition = "2024"

[dependencies]
ataqu-domain-health = { path = "../ataqu-domain-health" }
ataqu-domain-shopify = { path = "../ataqu-domain-shopify" }
hmac = "0.12"
hex = "0.4"
ataqu-infra-storage = { path = "../ataqu-infra-storage" }
axum = { version = "0.8.9", features = ["ws", "multipart"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["cors", "trace", "fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
futures = "0.3.31"
jsonwebtoken = "9.3.0"
uuid = { version = "1.24.0", features = ["v4", "v5", "v7", "serde"] }
rust_decimal = "1.32"
anyhow = "1.0.103"
chrono = { version = "0.4.45", features = ["serde"] }
thiserror = "2.0.18"
tokio = { version = "1.52", features = ["sync", "rt", "time", "macros", "fs", "io-util"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
async-trait = "0.1"
ataqu-application = { path = "../ataqu-application" }
ataqu-kernel = { path = "../ataqu-kernel" }
ataqu-security = { path = "../ataqu-security", features = ["infra-pii-access"] }
ataqu-contracts = { path = "../ataqu-contracts" }
ataqu-domain-aegis = { path = "../ataqu-domain-aegis" }
ataqu-domain-pause = { path = "../ataqu-domain-pause" }
ataqu-domain-cinq = { path = "../ataqu-domain-cinq" }
ataqu-domain-dial = { path = "../ataqu-domain-dial" }
ataqu-domain-pivot = { path = "../ataqu-domain-pivot" }
ataqu-domain-sond = { path = "../ataqu-domain-sond" }
ataqu-domain-spark = { path = "../ataqu-domain-spark" }
ataqu-domain-tempo = { path = "../ataqu-domain-tempo" }
ataqu-domain-vault = { path = "../ataqu-domain-vault" }
ataqu-domain-vista = { path = "../ataqu-domain-vista" }
ataqu-infra-repositories = { path = "../ataqu-infra-repositories" }
ataqu-infra-idempotency = { path = "../ataqu-infra-idempotency" }
sea-orm = { version = "2.0.0-rc.41", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "tls-rustls", "chrono", "uuid", "json", "macros"] }
csv = "1.3"
rand = "0.8.5"
argon2 = "0.5.3"
dashmap = "6.0.1"
lazy_static = "1.4"
moka = { version = "0.12", features = ["sync"] }
metrics-exporter-prometheus = "0.15"
metrics = "0.23"
sha2 = "0.10"
base64 = "0.22.1"
reqwest = { version = "0.12", features = ["json"] }
urlencoding = "2.1"
http = "1.0"
url = "2.5"

[dev-dependencies]
mockall = "0.15.0"
dotenvy = "0.15"