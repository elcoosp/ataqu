[package]
name = "ataqu-api"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.91"
axum = { version = "0.8.9", features = ["ws"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["cors", "trace"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.24.0", features = ["v4", "v5", "v7", "serde"] }
anyhow = "1.0.103"
thiserror = "2.0.18"
tracing = "0.1.44"
ataqu-application = { path = "../ataqu-application" }
ataqu-kernel = { path = "../ataqu-kernel" }
ataqu-security = { path = "../ataqu-security" }
ataqu-contracts = { path = "../ataqu-contracts" }

[dev-dependencies]
mockall = "0.15.0"
