[package]
name = "ataqu-domain-aegis"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.24", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
async-trait = "0.1"
tracing = "0.1"
ataqu-security = { path = "../ataqu-security" }
ataqu-kernel = { path = "../ataqu-kernel" }

base32 = "0.4"
hmac = "0.12"
sha1 = "0.10"
rand = "0.8"
urlencoding = "2.1"
