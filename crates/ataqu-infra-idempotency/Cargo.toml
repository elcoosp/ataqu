[package]
name = "ataqu-infra-idempotency"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.91"
chrono = { version = "0.4.45", features = ["serde"] }
sea-orm = { version = "2.0.0-rc.41", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.18"
tracing = "0.1.44"
uuid = { version = "1.24.0", features = ["v4", "v5", "v7", "serde"] }

moka = { version = "0.12.5", features = ["sync"] }
