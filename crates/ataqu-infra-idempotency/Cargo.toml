[package]
name = "ataqu-infra-idempotency"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.73"
chrono = "0.4.45"
moka = { version = "0.12.5", features = ["sync"] }
sea-orm = { version = "2.0.0-rc.41", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["postgres"] }
thiserror = "2.0.18"
tokio = { version = "1.52.2", features = ["full"] }
tracing = "0.1.44"
uuid = { version = "1.24.0", features = ["v7"] }

[dev-dependencies]
mockall = "0.12.0"
pretty_assertions = "1.4.0"
