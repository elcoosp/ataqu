[package]
name = "ataqu-security"
version = "0.1.0"
edition = "2024"

[dependencies]
rand = "0.8.5"

aes-gcm = { version = "0.10", features = ["std"] }
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["net"] }

[dev-dependencies]
tokio = { version = "1", features = ["net", "macros", "rt"] }

[features]
infra-pii-access = []
