[package]
name = "ataqu-bin"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "migrator"
path = "src/bin/migrator.rs"

[dependencies]
ataqu-infra-migration = { path = "../ataqu-infra-migration" }
sea-orm = { version = "2.0.0-rc.41", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
sea-orm-migration = "2.0.0-rc.41"
tokio = { version = "1.52", features = ["rt", "macros"] }
dotenvy = "0.15"
