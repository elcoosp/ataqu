[package]
name = "ataqu-bin"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ataqu"
path = "src/main.rs"

[[bin]]
name = "migrator"
path = "src/bin/migrator.rs"

[dependencies]
ataqu-api = { path = "../ataqu-api" }
ataqu-application = { path = "../ataqu-application" }
ataqu-kernel = { path = "../ataqu-kernel" }
ataqu-infra-outbox = { path = "../ataqu-infra-outbox" }
ataqu-infra-idempotency = { path = "../ataqu-infra-idempotency" }
ataqu-infra-pools = { path = "../ataqu-infra-pools" }
ataqu-infra-migration = { path = "../ataqu-infra-migration" }
ataqu-infra-repositories = { path = "../ataqu-infra-repositories" }

ataqu-domain-cinq = { path = "../ataqu-domain-cinq" }
ataqu-domain-aegis = { path = "../ataqu-domain-aegis" }
ataqu-domain-dial = { path = "../ataqu-domain-dial" }
ataqu-domain-spark = { path = "../ataqu-domain-spark" }
ataqu-security = { path = "../ataqu-security" }

axum = { version = "0.8.9", features = ["ws", "multipart"] }
tokio = { version = "1.52", features = ["rt", "macros", "rt-multi-thread", "signal"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["cors", "trace", "catch-panic"] }
tracing = "0.1"
tracing-subscriber = "0.3"
dotenvy = "0.15"
uuid = { version = "1.24.0", features = ["v4", "v7"] }
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1.0"
anyhow = "1.0"
sea-orm = { version = "2.0.0-rc.41", features = ["sqlx-postgres", "runtime-tokio-rustls"] }
async-trait = "0.1"
sea-orm-migration = "2.0.0-rc.41"
dashmap = "6.0.1"
